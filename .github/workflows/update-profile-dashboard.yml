name: Update profile dashboard

on:
  push:
    branches: [main]
    paths-ignore:
      - 'assets/generated/**'
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-profile-dashboard
  cancel-in-progress: false

jobs:
  update-dashboard:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'

      - name: Check snapshot logic
        run: python -m unittest discover -s scripts -p 'test_*.py'

      - name: Generate dashboard assets
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/update_profile.py

      - name: Detect changes
        id: changes
        run: |
          if [ -z "$(git status --porcelain -- assets/generated)" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No generated asset changes."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            git diff --stat -- assets/generated
          fi

      - name: Commit generated assets
        if: steps.changes.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/generated
          git commit -m "chore: refresh profile stats"
          git push origin HEAD:main
