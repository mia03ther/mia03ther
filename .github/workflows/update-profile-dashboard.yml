name: Update profile dashboard

on:
  push:
    branches: [main]
    paths-ignore:
      - 'assets/generated/**'
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-profile-dashboard
  cancel-in-progress: false

jobs:
  update-dashboard:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Generate dashboard assets
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/update_profile.py

      - name: Detect changes
        id: changes
        run: |
          if git diff --quiet -- assets/generated; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No generated asset changes."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            git diff --stat -- assets/generated
          fi

      - name: Commit generated assets
        if: steps.changes.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/generated
          git commit -m "chore: update builder dashboard"
          git push origin HEAD:main
