<svg xmlns="http://www.w3.org/2000/svg" width="900" height="245" viewBox="0 0 900 245" role="img" aria-labelledby="title desc">
  <title id="title">MIA_Ether — Learning by building</title>
  <desc id="desc">AI, Web3 and Data. An original silver and violet orbital illustration with two slowly moving points; all text remains static.</desc>
  <defs>
    <radialGradient id="glow"><stop stop-color="#26213e" stop-opacity=".7"/><stop offset="1" stop-color="#10121b" stop-opacity="0"/></radialGradient>
    <linearGradient id="metal" x1=".15" y1="0" x2=".9" y2="1"><stop stop-color="#c7cce2"/><stop offset=".5" stop-color="#31384f"/><stop offset="1" stop-color="#151927"/></linearGradient>
    <linearGradient id="orbit"><stop stop-color="#30364e"/><stop offset=".5" stop-color="#b6a8ff"/><stop offset="1" stop-color="#30364e"/></linearGradient>
    <clipPath id="clip"><rect width="900" height="245" rx="22"/></clipPath>
  </defs>
  <style>
    text {font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
    @media (prefers-reduced-motion: reduce) {.drift {display:none}}
  </style>
  <g clip-path="url(#clip)">
    <rect width="900" height="245" rx="22" fill="#10121b"/>
    <ellipse cx="718" cy="120" rx="240" ry="170" fill="url(#glow)"/>
    <path d="M40 228H860" fill="none" stroke="#30364e" stroke-opacity=".65"/>
    <text x="40" y="49" fill="#b6a8ff" font-size="12" font-weight="600" letter-spacing="2.3">LEARNING BY BUILDING</text>
    <text x="36" y="117" fill="#eef0fb" font-size="58" font-weight="650" letter-spacing="-2">MIA_Ether</text>
    <text x="40" y="154" fill="#a3abc1" font-size="20" letter-spacing=".1">AI × Web3 × Data</text>
    <text x="40" y="207" fill="#a3abc1" font-size="12">Guangzhou · GDUFS · Open source</text>
    <g transform="translate(710 121)">
      <ellipse rx="126" ry="47" transform="rotate(-30)" fill="none" stroke="url(#orbit)" stroke-width="1.3"/>
      <ellipse rx="126" ry="47" transform="rotate(38)" fill="none" stroke="#30364e" stroke-width="1.3"/>
      <ellipse rx="49" ry="99" transform="rotate(7)" fill="none" stroke="#30364e" stroke-width="1"/>
      <circle r="37" fill="url(#metal)"/>
      <circle r="36.5" fill="none" stroke="#c7cce2" stroke-opacity=".6"/>
      <path d="M-15 10V-10L0 3L15-10V10" fill="none" stroke="#f5f6ff" stroke-width="3.5" stroke-linejoin="round" stroke-linecap="round" opacity=".92"/>
    </g>
    <circle cx="603" cy="180" r="3.2" fill="#b6a8ff"/>
    <circle cx="807" cy="180" r="2.6" fill="#b6a8ff" opacity=".55"/>
    <path d="M824 56v12m-6-6h12" stroke="#b6a8ff" stroke-width="1.2" opacity=".8"/>
    <circle cx="579" cy="68" r="1.7" fill="#a3abc1" opacity=".55"/>
    <circle class="drift" r="3.2" fill="#b6a8ff">
      <animateMotion dur="16s" repeatCount="indefinite" path="M601 184A126 47 -30 1 0 819 58A126 47 -30 1 0 601 184"/>
    </circle>
    <circle class="drift" r="2.8" fill="#a3abc1">
      <animateMotion dur="21s" repeatCount="indefinite" path="M611 44A126 47 38 1 0 809 198A126 47 38 1 0 611 44"/>
    </circle>
  </g>
</svg>
