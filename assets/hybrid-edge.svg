<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 230" role="img" aria-labelledby="title desc">
  <title id="title">The hybrid edge</title>
  <desc id="desc">Code, content, and community converge through AI Web3 Data into product and ecosystem work.</desc>
  <defs><pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse"><path d="M30 0H0V30" fill="none" stroke="#1d252b"/></pattern></defs>
  <rect width="1200" height="230" rx="10" fill="#0b0d10"/><rect x="1" y="1" width="1198" height="228" rx="9" fill="url(#grid)" stroke="#303740"/>
  <g fill="#f5f2ea" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle" font-size="15" font-weight="700">
    <text x="155" y="70">CODE</text><text x="155" y="166">CONTENT</text><text x="1045" y="70">COMMUNITY</text><text x="1045" y="166">ECOSYSTEM</text>
  </g>
  <g fill="#7d8792" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" text-anchor="middle" font-size="11">
    <text x="155" y="92">systems · APIs · data</text><text x="155" y="188">research · writing · context</text><text x="1045" y="92">people · events · signal</text><text x="1045" y="188">protocols · builders · product</text>
  </g>
  <g stroke="#63f3e4" stroke-width="2" fill="none"><path d="M220 68C360 68 392 96 500 112"/><path d="M220 164C360 164 392 136 500 118"/></g>
  <g stroke="#b58cff" stroke-width="2" fill="none"><path d="M700 112C810 96 840 68 980 68"/><path d="M700 118C810 136 840 164 980 164"/></g>
  <rect x="475" y="76" width="250" height="78" rx="39" fill="#12171c" stroke="#b7f36b" stroke-width="2"/>
  <text x="600" y="108" text-anchor="middle" fill="#b7f36b" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15" font-weight="700">AI × WEB3 × DATA</text>
  <text x="600" y="130" text-anchor="middle" fill="#7d8792" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11">PRODUCT / RESEARCH / OPERATE</text>
